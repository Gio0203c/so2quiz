                    <li><strong>Regola Teorica:</strong> L'operatore <code>&&</code> esegue il cortocircuito. Se il primo termine è falso (0), il secondo non viene valutato. L'operatore <code>||</code> cortocircuita se il primo termine è vero (diverso da 0).</li>
                    <li><strong>Risoluzione Pratica:</strong> Se viene eseguito <code>if (fork() && fork()) { printf("A\n"); }</code>:
                      <ol style="margin-left: 1rem;">
                        <li>Il primo <code>fork()</code> viene chiamato. Crea un figlio.
                          <br>• Nel <strong>figlio</strong>, restituisce <code>0</code> (falso). L'operatore <code>&&</code> cortocircuita, il figlio salta il secondo operando, esce dall'if senza stampare.
                          <br>• Nel <strong>padre</strong>, restituisce <code>PID</code> (vero). Valuta il secondo operando.
                        </li>
                        <li>Il secondo <code>fork()</code> viene chiamato (solo dal padre originario). Crea un altro figlio.
                          <br>• Nel <strong>nuovo figlio</strong>, restituisce <code>0</code> (falso). L'intero <code>if</code> valuta a falso, quindi non stampa.
                          <br>• Nel <strong>padre originario</strong>, restituisce <code>PID</code> (vero). Entrambi gli operandi sono veri, quindi esegue <code>printf("A\n")</code>.
                        </li>
                        <li>La lettera <code>"A"</code> viene quindi stampata <strong>1 sola volta</strong>.</li>
                      </ol>
                    </li>
                  </ul>
                </div>
              </div>
            </section>
            
            <!-- SEZIONE 4 -->
            <section id="section-4" style="scroll-margin-top: 1rem;">
              <h3 style="font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-bottom: 1rem; border-left: 4px solid var(--primary); padding-left: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
                <span>🧵</span> 4. Programmazione Concorrente (POSIX Threads)
              </h3>
              <div style="display: flex; flex-direction: column; gap: 1.2rem; line-height: 1.6; font-size: 0.95rem;">
                <div>
                  <strong>Creazione ed Attesa Thread: <code>pthread_create</code> e <code>pthread_join</code></strong>
                  <br>
                  <code>pthread_create</code> avvia un thread parallelo e sovrascrive la variabile <code>pthread_t</code> passata con il Thread ID.
                  <div style="background: rgba(230,126,34,0.08); border-left: 4px solid #e67e22; padding: 0.6rem 0.8rem; border-radius: 4px; font-size: 0.88rem; margin-top: 0.4rem;">
                    ⚠️ <strong>WARNING: SOVRASCRITTURA DI TID</strong><br>
                    Se riutilizzi la stessa variabile <code>tid</code> per lanciare due thread senza fare <code>pthread_join</code> in mezzo:
                    <pre style="margin: 0.4rem 0; font-family: monospace; color: #e74c3c;">
pthread_create(&amp;tid, NULL, worker, NULL); 
pthread_create(&amp;tid, NULL, worker, NULL); // Sovrascrive tid!
pthread_join(tid, NULL); // Attende SOLO il secondo thread!</pre>
                    Il primo thread non potrà più essere unito, rimanendo in stato <strong>zombie</strong>.
                  </div>
                </div>
                <div style="background: rgba(52,152,219,0.08); border-left: 4px solid #3498db; padding: 0.8rem 1rem; border-radius: 6px; margin-top: 0.5rem;">
                  <strong>🔍 RISOLUZIONE ESERCIZI: Condivisione delle Risorse nei Thread</strong>
                  <br>
                  Negli esercizi che chiedono cosa viene modificato da un thread all'interno del processo:
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li><strong>Regola Teorica:</strong> Tutti i thread dello stesso processo condividono lo spazio degli indirizzi globale (variabili globali, heap, descrittori dei file). Hanno invece stack separati e registri di CPU unici.</li>
                    <li><strong>Risoluzione Pratica:</strong> Se un thread esegue un'assegnazione come <code>global_var = 100;</code>, tutti gli altri thread vedranno immediatamente la modifica. Per sincronizzare accessi concorrenti ed evitare <em>race conditions</em> su dati condivisi, è obbligatorio usare i <code>mutex</code> o i <code>semafori</code>.</li>
                  </ul>
                </div>
              </div>
            </section>
            
            <!-- SEZIONE 5 -->
            <section id="section-5" style="scroll-margin-top: 1rem;">
              <h3 style="font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-bottom: 1rem; border-left: 4px solid var(--primary); padding-left: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
                <span>💾</span> 5. Gestione della Memoria Dinamica in C
              </h3>
              <div style="display: flex; flex-direction: column; gap: 1.2rem; line-height: 1.6; font-size: 0.95rem;">
                <div>
                  <strong>Inizializzazione a zero: <code>calloc</code> vs <code>malloc</code> + <code>memset</code></strong>
                  <br>
                  Entrambi i metodi allocano memoria sull'heap e la azzerano (bit a 0). <code>calloc</code> previene integer overflow nel calcolo delle dimensioni rispetto alla moltiplicazione manuale in <code>malloc</code>.
                </div>
                <div>
                  <strong>Deallocazione di Matrici 2D</strong>
                  <br>
                  Per deallocare una matrice dinamica (es. <code>double **mat</code>) senza perdite di memoria:
                  <ol style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li>Liberare prima ciascuna riga in un ciclo: <span style="color: #3498db; font-weight: bold;"><code>free(mat[i]);</code></span></li>
                    <li>Liberare infine il puntatore principale: <span style="color: #3498db; font-weight: bold;"><code>free(mat);</code></span></li>
                  </ol>
                  <div style="background: rgba(231,76,60,0.08); border-left: 4px solid #e74c3c; padding: 0.6rem 0.8rem; border-radius: 4px; font-size: 0.88rem; margin-top: 0.4rem; color: #c0392b;">
                    🛑 <strong>CAUTION:</strong> Liberando prima il puntatore principale <code>free(mat)</code> si perde l'indirizzo delle righe, causando un permanente <strong>memory leak</strong> (perdita di memoria).
                  </div>
                </div>
              </div>
            </section>
            
            <!-- SEZIONE 6 -->
            <section id="section-6" style="scroll-margin-top: 1rem;">
              <h3 style="font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-bottom: 1rem; border-left: 4px solid var(--primary); padding-left: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
                <span>🔑</span> 6. Permessi del Filesystem Unix (chmod e Bit Speciali)
              </h3>
              <div style="display: flex; flex-direction: column; gap: 1.2rem; line-height: 1.6; font-size: 0.95rem;">
                <div>
                  <strong>La cifra dei Bit Speciali (Cifra Ottale 1)</strong>
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li><strong>SetUID (valore <span style="color: #e67e22; font-weight: bold;">4</span>)</strong>: Esegue il file con i privileges del <em>proprietario</em> (es. <code>passwd</code>). Simbolo: <code>s</code> al posto di <code>x</code> del proprietario.</li>
                    <li><strong>SetGID (valore <span style="color: #e67e22; font-weight: bold;">2</span>)</strong>: Esegue con i privileges del <em>gruppo proprietario</em>, o eredita il gruppo della cartella per i nuovi file. Simbolo: <code>s</code> al posto di <code>x</code> del gruppo.</li>
                    <li><strong>Sticky Bit (valore <span style="color: #e67e22; font-weight: bold;">1</span>)</strong>: Impedisce ad utenti non proprietari di cancellare/rinominare file in una directory condivisa (es. <code>/tmp</code>). Simbolo: <code>t</code> nei permessi altri.</li>
                  </ul>
                </div>
                <div>
                  <strong>Permessi Standard</strong>: Lettura (<code>r</code>=4), Scrittura (<code>w</code>=2), Esecuzione (<code>x</code>=1).
                </div>
                <div style="background: rgba(46,204,113,0.08); border-left: 4px solid #2ecc71; padding: 0.6rem 0.8rem; border-radius: 4px; font-size: 0.88rem;">
                  ⭐ <strong>Scomposizione permessi (es. <code>6774</code>):</strong>
                  <br>• Cifra speciale <code>6</code> = <code>SetUID (4) + SetGID (2)</code>.
                  <br>• Proprietario <code>7</code> = <code>rwx</code> (con SetUID diventa <span style="color: #2ecc71; font-weight: bold;"><code>rws</code></span>).
                  <br>• Gruppo <code>7</code> = <code>rwx</code> (con SetGID diventa <span style="color: #2ecc71; font-weight: bold;"><code>rws</code></span>).
                  <br>• Altri <code>4</code> = <span style="color: #2ecc71; font-weight: bold;"><code>r--</code></span>.
                  <br>• Stringa simbolica: <span style="color: #2ecc71; font-weight: bold;"><code>-rwsrwsr--</code></span>.
                </div>
                <div>
                  <strong>Permessi Minimi per le Directory</strong>
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li>Lettura (<code>r</code>): Permette di elencare i nomi dei file contenuti.</li>
                    <li>Esecuzione (<code>x</code>): Permette di attraversare la directory ed accedere ai file all'interno (es. fare <code>cd</code> o <code>cat</code>).</li>
                  </ul>
                  <div style="background: rgba(46,204,113,0.08); border-left: 4px solid #2ecc71; padding: 0.6rem 0.8rem; border-radius: 4px; font-size: 0.88rem; margin-top: 0.4rem;">
                    🚨 <strong>IMPORTANT:</strong> I permessi minimi richiesti su una cartella per poter elencare i file e contemporaneamente accedere/leggere i loro contenuti sono <span style="color: #2ecc71; font-weight: bold;"><code>r-x</code></span> (valore 5). Senza <code>x</code>, la lettura fallirà.
                  </div>
                </div>
                <div>
                  <strong>I tre Timestamps</strong>
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li><mark style="background-color: #f1c40f; color: #000; padding: 0.05rem 0.2rem; border-radius: 2px;"><code>atime</code></mark>: Ultima lettura del file (es. <code>cat</code>, <code>grep</code>).</li>
                    <li><mark style="background-color: #f1c40f; color: #000; padding: 0.05rem 0.2rem; border-radius: 2px;"><code>mtime</code></mark>: Ultima modifica del contenuto.</li>
                    <li><mark style="background-color: #f1c40f; color: #000; padding: 0.05rem 0.2rem; border-radius: 2px;"><code>ctime</code></mark>: Modifica dei metadati o inode (es. cambio permessi con <code>chmod</code> o rinomina).</li>
                  </ul>
                  <br>
                  Il comando <span style="color: #3498db; font-weight: bold;"><code>stat</code></span> mostra tutti e tre i timestamp. Il comando <span style="color: #3498db; font-weight: bold;"><code>touch</code></span> aggiorna atime e mtime al tempo corrente.
                </div>
                <div style="background: rgba(52,152,219,0.08); border-left: 4px solid #3498db; padding: 0.8rem 1rem; border-radius: 6px; margin-top: 0.5rem;">
                  <strong>🔍 RISOLUZIONE ESERCIZI: Bit Speciali e Rappresentazione Simbolica</strong>
                  <br>
                  Negli esercizi che chiedono il significato di una maschera come <code>4755</code> o della rappresentazione <code>-rwsr-xr-x</code>:
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li><strong>Regola Teorica:</strong> La prima cifra ottale (da 0 a 7) rappresenta i bit speciali: 4 = SetUID, 2 = SetGID, 1 = Sticky. Le altre tre cifre indicano User, Group e Others.</li>
                    <li><strong>Risoluzione Pratica:</strong> Se l'esercizio ti mostra <code>/usr/bin/passwd</code> con permessi <code>4755</code>:
                      <ol style="margin-left: 1rem;">
                        <li>La prima cifra è <code>4</code>, il che indica che il bit **SetUID** è settato.</li>
                        <li>La seconda cifra <code>7</code> indica permessi di lettura, scrittura ed esecuzione per il proprietario (User).</li>
                        <li>Ciò significa simbolicamente \`-rwsr-xr-x\` (la \`s\` sostituisce la \`x\` dello user).</li>
                        <li>Il comportamento pratico è che l'utente comune che lancia questo eseguibile acquisisce temporaneamente i permessi del proprietario del file (\`root\`), consentendogli di modificare la password shadow.</li>
                      </ol>
                    </li>
                  </ul>
                </div>
              </div>
            </section>
            
            <!-- SEZIONE 7 -->
            <section id="section-7" style="scroll-margin-top: 1rem;">
              <h3 style="font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-bottom: 1rem; border-left: 4px solid var(--primary); padding-left: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
                <span>📂</span> 7. System Call di I/O e File Locking
              </h3>
              <div style="display: flex; flex-direction: column; gap: 1.2rem; line-height: 1.6; font-size: 0.95rem;">
                <div>
                  <strong>File Descriptor vs Stream <code>FILE *</code></strong>
                  <br>
                  Le system call lavorano sui descrittori di file di basso livello (interi, es. <code>open()</code>). Le funzioni standard C lavorano su stream identificati da <code>FILE *</code> (es. <code>fopen()</code>). Non vanno scambiati o confusi.
                </div>
                <div>
                  <strong>La virgola nella system call <code>open()</code>: Flags vs Mode</strong>
                  <br>
                  La signature completa è <code>int open(const char *path, int flags, mode_t mode);</code>
                  <div style="background: rgba(231,76,60,0.08); border-left: 4px solid #e74c3c; padding: 0.6rem 0.8rem; border-radius: 4px; font-size: 0.88rem; margin-top: 0.4rem; color: #c0392b;">
                    🛑 <strong>CAUTION: LA TRAPPOLA DELLA VIRGOLA</strong><br>
                    I flag di stato (es. <code>O_RDWR | O_CREAT</code>) e i permessi del file (es. <code>S_IRUSR | S_IWUSR</code>) sono <strong>due argomenti distinti</strong> della funzione e vanno separati da una <mark style="background-color: #f1c40f; color: #000; padding: 0.05rem 0.2rem; border-radius: 2px;"><strong>virgola</strong></mark>, non combinati con l'operatore OR bitwise <code>|</code>.
                    <br>• <span style="color: #2ecc71; font-weight: bold;">CORRETTO (3 parametri):</span> <code>open("filename", O_RDWR | O_CREAT, S_IRUSR | S_IWUSR);</code>
                    <br>• <span style="color: #e74c3c; font-weight: bold;">ERRATO (2 parametri):</span> <code>open("filename", O_RDWR | O_CREAT | S_IRUSR | S_IWUSR);</code>
                    <br><em>Nell'errore, i permessi vengono fusi nei flags e il terzo argomento (permessi) rimarrà indefinito, creando il file con diritti casuali (garbage).</em>
                  </div>
                </div>
                <div>
                  <strong>Creazione esclusiva: <code>O_CREAT | O_EXCL</code></strong>
                  <br>
                  Se il file esiste già, la system call fallisce ritornando <code>-1</code> ed impostando <code>errno</code> a <code>EEXIST</code>.
                </div>
                <div>
                  <strong>File Locking via <code>fcntl</code></strong>
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li><code>F_RDLCK</code>: Lock di lettura (condiviso).</li>
                    <li><code>F_WRLCK</code>: Lock di scrittura (esclusivo).</li>
                  </ul>
                  <div style="background: rgba(230,126,34,0.08); border-left: 4px solid #e67e22; padding: 0.6rem 0.8rem; border-radius: 4px; font-size: 0.88rem; margin-top: 0.4rem;">
                    ⚠️ <strong>WARNING: IL TRAPPO DI <code>F_GETLK</code></strong><br>
                    Il comando <code>F_GETLK</code> <span style="color: #e74c3c; font-weight: bold;">NON imposta alcun blocco</span>. Serve solo a verificare la disponibilità del lock. Se è disponibile, restituisce <code>F_UNLCK</code> nel campo <code>l_type</code>.
                  </div>
                </div>
                <div>
                  <strong>Hard Links e Inode (<code>ln</code>)</strong>
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li>Creare un link fisico con <code>ln file1 link1</code> fa puntare entrambi <span style="color: #2ecc71; font-weight: bold;">allo stesso identico inode</span>, condividendo metadati, permessi e contenuti.</li>
                  </ul>
                </div>
                <div>
                  <strong>Ottenere l'Inode di un File</strong>
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li>Si usa <code>stat nomefile</code> o <code>ls -i nomefile</code>.</li>
                    <li><span style="color: #e74c3c; font-weight: bold;">Attenzione:</span> Il comando <code>stat -f nomefile</code> mostra lo <strong>stato del filesystem</strong>, non l'inode del singolo file!</li>
                  </ul>
                </div>
                <div>
                  <strong>Copia Selettiva con <code>dd</code>: <code>skip</code> vs <code>seek</code></strong>
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li>Per copiare esattamente i primi 100 caratteri (byte) da un file: <code>dd if=filein of=fileout bs=100 count=1</code>.</li>
                  </ul>
                  <div style="background: rgba(52,152,219,0.08); border-left: 4px solid #3498db; padding: 0.6rem 0.8rem; border-radius: 4px; font-size: 0.88rem; margin-top: 0.4rem;">
                    💡 <strong>TRUCCO MNEMONICO: <code>skip</code> vs <code>seek</code></strong><br>
                    • <mark style="background-color: #f1c40f; color: #000; padding: 0.05rem 0.2rem; border-radius: 2px;"><code>skip=N</code></mark>: Salta <code>N</code> blocchi sul file di <strong>input</strong> (<code>if</code>).
                    <br><em>Associazione:</em> sk<span style="color: #3498db; font-weight: bold;">i</span>p ha la lettera <span style="color: #3498db; font-weight: bold;">i</span> come <span style="color: #3498db; font-weight: bold;">i</span>nput (<code>if</code>).
                    <br>• <mark style="background-color: #f1c40f; color: #000; padding: 0.05rem 0.2rem; border-radius: 2px;"><code>seek=N</code></mark>: Si posiziona (seek) a <code>N</code> blocchi sul file di <strong>output</strong> (<code>of</code>).
                    <br><em>Associazione:</em> se<span style="color: #e67e22; font-weight: bold;">e</span>k si riferisce all'operazione di posizionamento della testina di scrittura sul file di output (<code>of</code>).
                  </div>
                </div>
                <div>
                  <strong>Mappatura di Memoria: <code>mmap</code> e <code>msync</code></strong>
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li><code>mmap</code> mappa un file in memoria. Con <code>MAP_SHARED</code>, le modifiche in RAM sono sincronizzabili su disco mediante la system call <span style="color: #3498db; font-weight: bold;"><code>msync(addr, len, flags)</code></span>.</li>
                  </ul>
                </div>
                <div style="background: rgba(52,152,219,0.08); border-left: 4px solid #3498db; padding: 0.8rem 1rem; border-radius: 6px; margin-top: 0.5rem;">
                  <strong>🔍 RISOLUZIONE ESERCIZI: Copia di porzioni di File con <code>dd</code></strong>
                  <br>
                  Negli esercizi che chiedono di copiare una determinata porzione di file a partire da un offset:
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li><strong>Regola Teorica:</strong> 
                      <br>• <code>bs</code> indica la dimensione del blocco in byte.
                      <br>• <code>skip</code> salta byte in *input* (da dove iniziare a leggere).
                      <br>• <code>seek</code> salta byte in *output* (dove scrivere nel file destinazione).
                      <br>• <code>count</code> indica quanti blocchi copiare.
                    </li>
                    <li><strong>Risoluzione Pratica:</strong> Se devi copiare 100 caratteri a partire dal decimo da <code>filein</code> a <code>fileout</code>:
                      <ol style="margin-left: 1rem;">
                        <li>Imposta la granularità a 1 byte: <code>bs=1</code>.</li>
                        <li>Per iniziare dal 10° carattere, devi saltare i primi 10: <code>skip=10</code>.</li>
                        <li>Per copiare 100 caratteri, specifichi: <code>count=100</code>.</li>
                        <li>Comando finale: <code>dd if=filein of=fileout bs=1 skip=10 count=100</code>.</li>
                      </ol>
                    </li>
                  </ul>
                </div>
              </div>
            </section>
            
            <!-- SEZIONE 8 -->
            <section id="section-8" style="scroll-margin-top: 1rem;">
              <h3 style="font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-bottom: 1rem; border-left: 4px solid var(--primary); padding-left: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
                <span>👥</span> 8. Gestione Utenti e Comandi Unix
              </h3>
              <div style="display: flex; flex-direction: column; gap: 1.2rem; line-height: 1.6; font-size: 0.95rem;">
                <div>
                  <strong>Security delle Password: <code>/etc/shadow</code></strong>
                  <br>
                  Il file <code>/etc/shadow</code> contiene le password cifrate (leggibile solo da root). Il comando <code>passwd</code> ha il bit **SetUID attivo**, permettendo a chiunque di modificare temporaneamente il file shadow per cambiare la propria password.
                </div>
                <div>
                  <strong>Creazione Utente: <code>adduser</code> vs <code>useradd</code></strong>
                  <br>
                  <code>useradd</code> è l'utility nativa di basso livello. <code>adduser</code> è lo script interattivo Perl di alto livello che configura automaticamente cartella home e password.
                </div>
                <div>
                  <strong>Comandi Privilegiati: <code>sudo</code> vs <code>su</code></strong>
                  <br>
                  <code>sudo</code> esegue comandi richiedendo la password <em>personale dell'utente</em>. <code>su</code> avvia una shell richiedendo la password <em>dell'utente target</em> (ovvero password di root).
                </div>
                <div>
                  <strong>Visualizzazione ad Albero: <code>tree</code></strong>
                  <br>
                  Per impostare la profondità massima dell'albero a 3 livelli, si usa l'opzione <mark style="background-color: #f1c40f; color: #000; padding: 0.05rem 0.2rem; border-radius: 2px;"><code>-L 3</code></mark> (es. <code>tree -L 3 dir1</code>).
                  <br>
                  <span style="color: #e74c3c; font-weight: bold;">Attenzione:</span> Opzioni come <code>--max-depth</code> non sono supportate da <code>tree</code>.
                </div>
                <div>
                  <strong>Pipeline in Background</strong>
                  <br>
                  Concatenare più comandi tramite pipe in background (es. <code>sleep 30 | sleep 15 | sleep 10 &amp;</code>) crea <span style="color: #2ecc71; font-weight: bold;">un unico job in background</span> complessivo dal sistema.
                </div>
                <div>
                  <strong>Montaggio Filesystem</strong>
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li><code>/etc/fstab</code>: Filesystem montati automaticamente all'avvio.</li>
                    <li><code>/etc/mtab</code>: Filesystem attualmente montati in tempo reale.</li>
                  </ul>
                </div>
                <div>
                  <strong>Tolleranza delle modalità di <code>fopen</code> in Linux</strong>
                  <br>
                  La modalità non standard <span style="color: #2ecc71; font-weight: bold;"><code>"rw+"</code></span> viene tollerata dalla libreria <code>glibc</code> di Linux ed interpretata come <code>"r+"</code> (lettura/scrittura su file esistente), per cui la chiamata funziona e scrive senza crashare.
                </div>
                <div style="background: rgba(52,152,219,0.08); border-left: 4px solid #3498db; padding: 0.8rem 1rem; border-radius: 6px; margin-top: 0.5rem;">
                  <strong>🔍 RISOLUZIONE ESERCIZI: Pipeline in Background e Job Control</strong>
                  <br>
                  Negli esercizi che chiedono quanti job in background o quanti processi vengono creati da una riga di comando:
                  <ul style="margin-left: 1.5rem; margin-top: 0.25rem;">
                    <li><strong>Regola Teorica:</strong> Una pipeline (comandi uniti da <code>|</code>) viene eseguita in parallelo in processi separati. L'operatore <code>&</code> alla fine mette l'intera pipeline in background, considerandola come un singolo **Job** (lavoro della shell).</li>
                    <li><strong>Risoluzione Pratica:</strong> Se esegui <code>sleep 30 | sleep 15 | sleep 10 &</code>:
                      <ol style="margin-left: 1rem;">
                        <li>Vengono creati 3 processi separati, uno per ciascun comando \`sleep\`.</li>
                        <li>Tutti e 3 i processi vengono collegati da pipe.</li>
                        <li>Il carattere <code>&amp;</code> mette in background l'intera pipeline come **1 singolo Job** nella tabella dei job della shell (assegnandole un ID tipo \`[1]\`).</li>
                      </ol>
                    </li>
                  </ul>
                </div>
              </div>
            </section>
            
          </div>
        </div>
      `;
    }

    // Render active question detail card or simulation dashboard
    function renderActiveQuestion() {
      const container = document.getElementById('content-area');

      if (state.mode === 'guide') {
        container.innerHTML = getGuideHtml();
        const targetId = `section-${state.currentGuideSection + 1}`;
        const targetEl = document.getElementById(targetId);
        if (targetEl) {
          setTimeout(() => {
            targetEl.scrollIntoView({ behavior: 'auto', block: 'start' });
          }, 50);
        }
        return;
      }

      if (state.mode === 'simulation' && state.simFinished && state.currentIndex === null) {
        renderSimulationDashboard(container);
        return;
      }

      if (state.mode === 'endless' && state.endlessScore === state.filteredQuestions.length && state.filteredQuestions.length > 0) {
        renderEndlessVictoryScreen(container);
        return;
      }

      if (state.filteredQuestions.length === 0) {
        if (state.mode === 'review') {
          container.innerHTML = `
            <div class="sim-result-card" style="max-width: 42rem;">
              <span class="filter-label">Ripasso Errori</span>
              <div style="font-size: 4rem; margin: 1rem 0;">🎉</div>
              <h2 style="font-weight: 700; margin-bottom: 0.5rem;">Nessun errore da ripassare!</h2>
              <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
                Ottimo lavoro! Non hai risposte errate registrate nella modalità Esercitazione. Continua così!
              </p>
              <button class="btn btn-primary" onclick="switchMode('practice')">Torna all'Esercitazione</button>
            </div>
          `;
        } else {
          container.innerHTML = '<div class="empty-state">Seleziona una domanda dal menu laterale per iniziare.</div>';
        }
        return;
      }

      const q = state.filteredQuestions[state.currentIndex];
      if (!q) {
        container.innerHTML = '<div class="empty-state">Seleziona una domanda dal menu laterale per iniziare.</div>';
        return;
      }

      let isVerified = false;
      let checked = null;
      if (state.mode === 'endless') {
         isVerified = !!state.endlessAnswer;
         checked = state.endlessAnswer;
      } else {
         checked = state.checkedAnswers[q.id];
         isVerified = state.mode === 'practice' ? !!checked : (state.mode === 'review' ? !!checked : state.simFinished);
      }

      let html = `
        <div class="card" id="quiz-card">
          <div class="card-header">
            <div class="q-meta">
              <span class="q-topic-pill">${q.topic || 'Argomento'}</span>
              <span class="q-number-pill">Quesito ${state.currentIndex + 1} di ${state.filteredQuestions.length}</span>
            </div>
            <span style="font-size: 0.8rem; color: var(--text-muted); font-family: var(--font-mono)">ID: ${q.id}</span>
          </div>
      `;

      html += `<div>${parseQuestionText(q.question)}</div>`;

      html += `<div class="options-grid">`;
      const mapping = state.shuffledIndices[q.id] || Array.from({length: q.options.length}, (_, i) => i);
      mapping.forEach((origIdx, uiIdx) => {
        const opt = q.options[origIdx];
        const optionLetter = String.fromCharCode(65 + uiIdx);
        let optionClass = '';
        let isCorrect = origIdx === q.correct_index;
        
        let isSelected = false;
        if (state.mode === 'practice' || state.mode === 'review') {
          isSelected = state.selectedAnswer === origIdx || (isVerified && checked && checked.selected === origIdx);
        } else if (state.mode === 'endless') {
          isSelected = state.selectedAnswer === origIdx || (isVerified && checked && checked.selected === origIdx);
        } else {
          isSelected = state.selectedAnswer === origIdx || state.simAnswers[q.id] === origIdx;
        }
        
        if (isVerified) {
          if (isCorrect) {
            optionClass = 'correct';
          } else if (isSelected) {
            optionClass = 'incorrect';
          }
        } else if (isSelected) {
          optionClass = 'selected';
        }

        let statusText = '';
        if (isVerified) {
          if (isCorrect) {
            statusText = '<span class="option-status correct">✓ Corretta</span>';
          } else if (isSelected) {
            statusText = '<span class="option-status incorrect">✗ Errata</span>';
          }
        }

        html += `
          <button class="option-button ${optionClass}" onclick="selectOption(${origIdx})" ${isVerified ? 'disabled' : ''}>
            <div>
              <span class="option-badge">${optionLetter}</span>
              <span>${opt.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/`([^`]+)`/g, '<code>$1</code>')}</span>
            </div>
            ${statusText}
          </button>
        `;
      });
      html += `</div>`;

      const isNextDisabled = state.currentIndex >= state.filteredQuestions.length - 1;
      const isPrevDisabled = state.currentIndex <= 0;

      if (state.mode === 'practice') {
        const isVerifyDisabled = state.selectedAnswer === null || isVerified;
        html += `
          <div class="actions">
            <button class="btn btn-secondary" onclick="navigate(-1)" ${isPrevDisabled ? 'disabled' : ''}>← Precedente</button>
            
            ${isVerified ? 
              `<button class="btn btn-primary" onclick="navigate(1)" ${isNextDisabled ? 'disabled' : ''}>Successiva →</button>` :
              `<button class="btn btn-primary" onclick="verifyAnswer()" ${isVerifyDisabled ? 'disabled' : ''}>Verifica Risposta</button>`
            }
          </div>
        `;
      
      } else if (state.mode === 'endless') {
        if (state.endlessGameOver) {
          html += `
            <div class="actions" style="flex-direction: column; gap: 0.8rem; align-items: center; width: 100%;">
              <span style="font-size: 1.1rem; color: var(--error); font-weight: 700; text-align: center;">${state.endlessQuote}</span>
              <button class="btn btn-primary" onclick="startEndless()">Ricomincia da capo</button>
            </div>
          `;
        } else if (isVerified) {
          html += `
            <div class="actions" style="width: 100%;">
              <span style="font-size: 0.95rem; color: var(--success); font-weight: 700; display: flex; align-items: center; gap: 0.3rem;">
                ${state.endlessQuote}
              </span>
              <button class="btn btn-primary" onclick="nextEndlessQuestion()">Prossima Domanda →</button>
            </div>
          `;
        } else {
          const isVerifyDisabled = state.selectedAnswer === null;
          html += `
            <div class="actions" style="width: 100%;">
              <span style="font-size: 0.85rem; color: var(--text-muted);">Punteggio: ${state.endlessScore}</span>
              <button class="btn btn-primary" onclick="verifyAnswer()" ${isVerifyDisabled ? 'disabled' : ''}>Verifica Risposta</button>
            </div>
          `;
        }
      } else if (state.mode === 'review') {
        if (checked) {
          if (checked.correct) {
            html += `
              <div class="actions">
                <span style="font-size: 0.95rem; color: var(--success); font-weight: 700; display: flex; align-items: center; gap: 0.3rem;">
                  🎉 Risposta Corretta!
                </span>
                <button class="btn btn-primary" onclick="removeErrorAndContinue()">Rimuovi e Continua →</button>
              </div>
            `;
          } else {
            html += `
              <div class="actions">
                <button class="btn btn-secondary" onclick="navigate(-1)" ${isPrevDisabled ? 'disabled' : ''}>← Precedente</button>
                <button class="btn btn-primary" onclick="retryReviewQuestion('${q.id}')">Riprova Quesito</button>
                <button class="btn btn-secondary" onclick="navigate(1)" ${isNextDisabled ? 'disabled' : ''}>Successiva →</button>
              </div>
            `;
          }
        } else {
          const isVerifyDisabled = state.selectedAnswer === null;
          html += `
            <div class="actions">
              <button class="btn btn-secondary" onclick="cancelRetry('${q.id}')">Annulla</button>
              <button class="btn btn-primary" onclick="verifyAnswer()" ${isVerifyDisabled ? 'disabled' : ''}>Verifica Risposta</button>
            </div>
          `;
        }
      } else {
        html += `
          <div class="actions">
            <button class="btn btn-secondary" onclick="navigate(-1)" ${isPrevDisabled ? 'disabled' : ''}>← Precedente</button>
            
            ${state.simFinished && state.currentIndex === state.filteredQuestions.length - 1 ? 
              `<button class="btn btn-primary" onclick="showDashboardOverview()">Mostra Risultati Esame</button>` :
              `<button class="btn btn-primary" onclick="navigate(1)" ${isNextDisabled ? 'disabled' : ''}>Successiva →</button>`
            }
          </div>
        `;
      }

      if (isVerified) {
        html += `
          <div class="explanation-container">
            <div class="explanation-title">
              <span>💡</span> Spiegazione Didattica
            </div>
            <div class="explanation-text">${formatExplanation(getDynamicExplanation(q))}</div>
          </div>
        `;
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    // Render the Simulation Final Results Dashboard
    function renderSimulationDashboard(container) {
      const res = state.simResult;
      const isSufficient = res.passed;
      
      let html = `
        <div class="sim-result-card">
          <span class="filter-label">Risultato della simulazione</span>
          
          <div class="grade-circle ${isSufficient ? 'sufficient' : 'insufficient'}">
            <span class="grade-val" style="font-size: ${res.grade === 'INSUF' ? '2.1rem' : '2.8rem'};">${res.grade}</span>
            <span class="grade-max">${res.grade === '30L' ? 'e lode' : 'su 30'}</span>
          </div>
          
          <div class="grade-label ${isSufficient ? 'success' : 'error'}">
            ${isSufficient ? 'Superato!' : 'Insufficiente'}
          </div>

          <p style="font-size: 0.95rem; color: var(--text-muted); max-width: 32rem; line-height: 1.5;">
            L'esame consiste in 45 domande. Ciascuna risposta corretta attribuisce <b>+2 punti</b>, ciascuna errata <b>-1 punto</b> e le risposte omesse <b>0 punti</b>. Il voto finale è calcolato in base alla tabella ufficiale dei punteggi d'esame.
          </p>

          <div class="sim-details-grid">
            <div class="sim-detail-card" style="border-top: 3px solid var(--success)">
              <span class="sim-detail-val success">${res.correct}</span>
              <span class="sim-detail-label">Corrette (+2)</span>
            </div>
            <div class="sim-detail-card" style="border-top: 3px solid var(--error)">
              <span class="sim-detail-val error">${res.wrong}</span>
              <span class="sim-detail-label">Errate (-1)</span>
            </div>
            <div class="sim-detail-card" style="border-top: 3px solid var(--warning)">
              <span class="sim-detail-val warning">${res.blank}</span>
              <span class="sim-detail-label">Non Date (0)</span>
            </div>
            <div class="sim-detail-card" style="border-top: 3px solid var(--primary)">
              <span class="sim-detail-val" style="color: var(--primary)">${res.score} <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted)">/90</span></span>
              <span class="sim-detail-label">Punti Totali</span>
            </div>
          </div>

          <div style="display: flex; gap: 1rem; margin-top: 1rem; width: 100%; max-width: 25rem;">
            <button class="btn btn-secondary" style="flex: 1;" onclick="switchMode('practice')">Torna a Pratica</button>
            <button class="btn btn-primary" style="flex: 1;" onclick="reviewSimulationQuestions()">Rivedi Risposte</button>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }
    function reviewSimulationQuestions() {
      state.currentIndex = 0;
      renderSidebar();
      renderActiveQuestion();
    }

    function showDashboardOverview() {
      state.currentIndex = null;
      renderSidebar();
      renderActiveQuestion();
    }

    function retryReviewQuestion(qId) {
      const checked = state.checkedAnswers[qId];
      if (checked) {
        state.lastFailedSelection = {
          id: qId,
          selected: checked.selected
        };
      }
      delete state.checkedAnswers[qId];
      state.selectedAnswer = null;
      renderActiveQuestion();
      renderSidebar();
    }

    function cancelRetry(qId) {
      if (state.lastFailedSelection && state.lastFailedSelection.id === qId) {
        state.checkedAnswers[qId] = {
          selected: state.lastFailedSelection.selected,
          correct: false
        };
      } else {
        state.checkedAnswers[qId] = {
          selected: 0,
          correct: false
        };
      }
      state.selectedAnswer = null;
      renderActiveQuestion();
      renderSidebar();
    }

    function removeErrorAndContinue() {
      const remainingErrors = state.questions.filter(q => {
        const checked = state.checkedAnswers[q.id];
        return checked && !checked.correct;
      });
      
      if (remainingErrors.length === 0) {
        state.filteredQuestions = [];
        state.currentIndex = null;
      } else {
        let nextIndex = state.currentIndex;
        state.filteredQuestions = remainingErrors;
        if (nextIndex >= state.filteredQuestions.length) {
          nextIndex = state.filteredQuestions.length - 1;
        }
        state.currentIndex = nextIndex;
      }
      
      state.selectedAnswer = null;
      renderSidebar();
      renderActiveQuestion();
      updateStats();
    }

    // Keyboard support logic
    function handleKeyPress(e) {
      if (state.mode === 'guide') {
        if (['1', '2', '3', '4', '5', '6', '7', '8'].includes(e.key)) {
          const sectionIdx = parseInt(e.key) - 1;
          state.currentGuideSection = sectionIdx;
          renderSidebar();
          const targetEl = document.getElementById(`section-${sectionIdx + 1}`);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }
        return;
      }

      const q = state.filteredQuestions[state.currentIndex];
      if (!q) return;

      let isVerified = false;
      let checked = null;
      if (state.mode === 'endless') {
         isVerified = !!state.endlessAnswer;
         checked = state.endlessAnswer;
      } else {
         checked = state.checkedAnswers[q.id];
         isVerified = state.mode === 'practice' ? !!checked : (state.mode === 'review' ? !!checked : state.simFinished);
      }

      if (!isVerified && ['1', '2', '3', '4'].includes(e.key)) {
        const uiIdx = parseInt(e.key) - 1;
        const mapping = state.shuffledIndices[q.id] || Array.from({length: q.options.length}, (_, i) => i);
        if (uiIdx < mapping.length) {
          const origIdx = mapping[uiIdx];
          selectOption(origIdx);
        }
      }

      
      if (e.key === 'Enter') {
        if (state.mode === 'endless') {
          if (!isVerified && state.selectedAnswer !== null) {
            verifyAnswer();
          } else if (isVerified && !state.endlessGameOver) {
            nextEndlessQuestion();
          } else if (isVerified && state.endlessGameOver) {
            startEndless();
          }
        } else if (state.mode === 'practice') {

          if (!isVerified && state.selectedAnswer !== null) {
            verifyAnswer();
          } else if (isVerified && state.currentIndex < state.filteredQuestions.length - 1) {
            navigate(1);
          }
        
      } else if (state.mode === 'endless') {
        if (state.endlessGameOver) {
          html += `
            <div class="actions" style="flex-direction: column; gap: 0.8rem; align-items: center; width: 100%;">
              <span style="font-size: 1.1rem; color: var(--error); font-weight: 700; text-align: center;">${state.endlessQuote}</span>
              <button class="btn btn-primary" onclick="startEndless()">Ricomincia da capo</button>
            </div>
          `;
        } else if (isVerified) {
          html += `
            <div class="actions" style="width: 100%;">
              <span style="font-size: 0.95rem; color: var(--success); font-weight: 700; display: flex; align-items: center; gap: 0.3rem;">
                ${state.endlessQuote}
              </span>
              <button class="btn btn-primary" onclick="nextEndlessQuestion()">Prossima Domanda →</button>
            </div>
          `;
        } else {
          const isVerifyDisabled = state.selectedAnswer === null;
          html += `
            <div class="actions" style="width: 100%;">
              <span style="font-size: 0.85rem; color: var(--text-muted);">Punteggio: ${state.endlessScore}</span>
              <button class="btn btn-primary" onclick="verifyAnswer()" ${isVerifyDisabled ? 'disabled' : ''}>Verifica Risposta</button>
            </div>
          `;
        }
      } else if (state.mode === 'review') {
          if (!isVerified && state.selectedAnswer !== null) {
            verifyAnswer();
          } else if (isVerified && checked && checked.correct) {
            removeErrorAndContinue();
          } else if (isVerified && state.currentIndex < state.filteredQuestions.length - 1) {
            navigate(1);
          }
        } else {
          if (state.currentIndex < state.filteredQuestions.length - 1) {
            navigate(1);
          } else if (state.simFinished) {
            showDashboardOverview();
          }
        }
      }

      if (state.mode !== 'endless' && e.key === 'ArrowRight' && state.currentIndex < state.filteredQuestions.length - 1) {
        navigate(1);
      }
      if (state.mode !== 'endless' && e.key === 'ArrowLeft' && state.currentIndex > 0) {
        navigate(-1);
      }
    }

    // Select an option click handler
    function selectOption(idx) {
      const q = state.filteredQuestions[state.currentIndex];
      
      if (state.mode === 'practice' || state.mode === 'review') {
        if (state.checkedAnswers[q.id]) return;
        state.selectedAnswer = idx;
      } else if (state.mode === 'endless') {
        if (state.endlessAnswer) return;
        state.selectedAnswer = idx;
      } else {
        if (state.simFinished) return;
        
        if (state.simAnswers[q.id] === idx) {
          delete state.simAnswers[q.id];
          state.selectedAnswer = null;
        } else {
          state.simAnswers[q.id] = idx;
          state.selectedAnswer = idx;
        }
      }
      
      renderActiveQuestion();
      renderSidebar();
    }

    // Verify option logic (Practice mode only)
    function verifyAnswer() {
      const q = state.filteredQuestions[state.currentIndex];
      if (state.selectedAnswer === null) return;
      
      const isCorrect = state.selectedAnswer === q.correct_index;
      
      if (state.mode === 'endless') {
        if (state.endlessAnswer) return;
        state.endlessAnswer = { selected: state.selectedAnswer, correct: isCorrect };
        
        // Pause timer on verification
        clearInterval(state.endlessTimerId);
        
        if (isCorrect) {
          state.endlessScore++;
          if (state.endlessScore > state.endlessHighScore) {
            state.endlessHighScore = state.endlessScore;
            localStorage.setItem('so2_crocette_endless_high', state.endlessHighScore);
          }
          // Save record time ONLY when completing all questions in the test (score === total questions)
          if (state.endlessScore === state.filteredQuestions.length) {
            if (state.endlessBestTime === 0 || state.endlessTime < state.endlessBestTime) {
              state.endlessBestTime = state.endlessTime;
              localStorage.setItem('so2_crocette_hardcore_best_time', state.endlessBestTime);
            }
            state.endlessQuote = `🏆 Vittoria! Hai completato tutte le domande in ${formatDuration(state.endlessTime)}!`;
          } else {
            state.endlessQuote = "Risposta corretta (+1 punto)";
          }
        } else {
          state.endlessGameOver = true;
          state.endlessQuote = `💥 Game Over<br><span style="font-size: 1.3rem; margin-top: 0.6rem; display: block; color: var(--text-muted); font-family: var(--font-mono);">Punteggio finale: ${state.endlessScore}</span><span style="font-size: 0.92rem; margin-top: 1rem; display: block; font-style: italic; font-weight: normal; color: var(--text-muted); line-height: 1.5;">«La determinazione è fallire per 19 volte e avere successo la ventesima.»<br><small style="font-size: 0.8rem; font-style: normal; opacity: 0.85;">— Julie Andrews</small></span>`;
        }
        renderActiveQuestion();
        renderSidebar();
        return;
      }

      if (state.checkedAnswers[q.id]) return;

      state.checkedAnswers[q.id] = {
        selected: state.selectedAnswer,
        correct: isCorrect
      };

      saveProgress();
      renderActiveQuestion();
      renderSidebar();
    }

    // Navigate questions (+1 or -1)
    function navigate(dir) {
      const targetIndex = state.currentIndex + dir;
      if (targetIndex >= 0 && targetIndex < state.filteredQuestions.length) {
        selectQuestion(targetIndex);
      }
    }

    // Reset quiz stats and storage
    function resetQuiz() {
      if (confirm('Sei sicuro di voler resettare tutte le risposte date finora? L\'intera cronologia andrà persa.')) {
        state.checkedAnswers = {};
        state.selectedAnswer = null;
        generateShuffledIndices(); // Fresh shuffle on reset
        saveProgress();
        selectQuestion(0);
      }
    }

    // Load progress from LocalStorage
    function loadProgress() {
      const saved = localStorage.getItem('so2_crocette_progress');
      if (saved) {
        try {
          state.checkedAnswers = JSON.parse(saved);
        } catch(e) {
          console.error(e);
        }
      }
    }

    // Start App
    window.addEventListener('DOMContentLoaded', () => {
      init();
    });
  </script>
</body>
</html>
